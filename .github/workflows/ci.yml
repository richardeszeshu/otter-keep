name: CI

on:
  push:
    branches: [ "main", "release/**", "release/*", "release-*" ]
  pull_request:
    branches: [ "main", "release/**", "release/*", "release-*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS 15 / Swift 6.0)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift / Xcode version
        run: |
          swift --version
          xcodebuild -version

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build all targets (Release)
        run: swift build -c release

      - name: Run Test Runner & Benchmarks
        run: swift run -c release OtterKeepTestRunner
