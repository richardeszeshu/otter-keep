name: Bug Report
description: Report an unexpected issue, crash, or bug in the application
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this issue! Please provide the details below to help us locate and resolve the bug as quickly as possible.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Provide a clear and concise description of what went wrong.
      placeholder: e.g., The application unexpectedly quits when clicking the export button.
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Provide clear, numbered steps explaining how to trigger the issue from a fresh launch.
      placeholder: |
        1. Open the application.
        2. Go to 'File' > 'Import...'.
        3. Select any standard `.json` file.
        4. Observe the crash immediately after selecting the file.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Explain what should have happened instead.
      placeholder: e.g., The file should import and display in the sidebar without errors.
    validations:
      required: true

  - type: dropdown
    id: macos-version
    attributes:
      label: macOS Version
      description: Check this under Apple Menu () > About This Mac.
      options:
        - "macOS 27 Golden Gate"
        - "macOS 26 Tahoe"
        - "macOS 15 Sequoia"
        - "macOS 14 Sonoma"
        - "macOS 13 Ventura"
        - "macOS 12 Monterey or earlier"
        - "Other / Beta version"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Mac Model / Architecture
      description: What processor is your Mac running? (Apple Menu > About This Mac)
      options:
        - "Apple Silicon (M1, M2, M3, M4, etc.)"
        - "Intel-based Mac"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Application Version
      description: Found in the top menu bar under OtterKeep > Preferences > About OtterKeep.
      placeholder: e.g., 1.2.0 (Build 45)
    validations:
      required: true

  - type: textarea
    id: crash-logs
    attributes:
      label: Crash Logs or Error Text (Optional)
      description: |
        If the app crashed, paste the system crash log text here or drag and drop the `.ips` / `.crash` file (located in Console.app under "Crash Reports").
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Screenshots or Additional Context
      description: Drag and drop screenshots or screen recordings directly into this field.

  - type: checkboxes
    id: checklist
    attributes:
      label: Verification
      options:
        - label: I searched open and closed issues to ensure this is not a duplicate.
          required: false
        - label: This report does not expose sensitive personal information (passwords, private file paths, API tokens).
          required: true